<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coba Background</title>
    <style>
        body {
            background-color: lightblue;
            background-image: linear-gradient( 30deg, navy,yellow, purple , pink);
            height: 100vh;
        }
        .kotak1 {
            width: 300px;
            height:300px;
            background-color: crimson;
            background-image: linear-gradient(to bottom,grey, green);
            
        }
        .kotak2 {
            width: 300px;
            height:300px;
            background-color: crimson;
            background-image: radial-gradient(yellow,navy);
            
        }
        .kotak3 {
            width: 300px;
            height:300px;
            background-color: crimson;
            background-image: conic-gradient(red, green,blue);
            
        }

    </style>
</head>
<body>
    <div class="kotak1"></div>
    <div class="kotak2"></div>
    <div class="kotak3"></div>
</body>
</html>
