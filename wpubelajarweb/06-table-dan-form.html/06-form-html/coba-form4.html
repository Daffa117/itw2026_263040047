<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>coba elemen form di dalam table</title>
  </head>
  <body>
    <h1>Contoh elemen-elemen Form pada HTML</h1>
    <form>
      <table cellpadding="4">
        <tr>
          <td align="right"><label for="nama">Nama:</label></td>
          <td><input type="text" name="nama" id="nama" /></td>
        </tr>
        <tr>
          <td align="right"><label for="password">Password:</label></td>
          <td><input type="password" name="password" id="password" /></td>
        </tr>
        <tr>
          <td align="right"><label for="email">Email:</label></td>
          <td><input type="email" name="email" id="email" /></td>
        </tr>
        <tr>
          <td align="right"><label for="angka">Angka:</label></td>
          <td><input type="number" name="angka" id="angka" /></td>
        </tr>
        <tr>
          <td align="right"><label for="tanggal">Tanggal:</label></td>
          <td><input type="date" name="tanggal" id="tanggal" /></td>
        </tr>
        <tr>
          <td align="right"><label for="alamat">Alamat:</label></td>
          <td><input type="text" name="alamat" id="alamat" /></td>
        </tr>
      </table>
    </form>
    <br />
    <button type="submit">kirim</button>
  </body>
</html>
